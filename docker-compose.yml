services:
  mysql-db:
    image: mysql:8.0
    container_name: clubes_exitus_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clubes_exitus
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - exitus_network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clubes_exitus_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://root:root@mysql-db:3306/clubes_exitus"
      JWT_SECRET: "una_clave_secreta_muy_larga_y_segura_123!"
      JWT_EXPIRES_IN: "24h"
    depends_on:
      - mysql-db
    networks:
      - exitus_network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: clubes_exitus_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - exitus_network
    restart: always

networks:
  exitus_network:
    driver: bridge

volumes:
  mysql_data:
